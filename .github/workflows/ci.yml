# ==============================================================================
# TutorIA MVP — Integración Continua (GitHub Actions)
# ==============================================================================
#
# Ejecuta los mismos gates de calidad definidos en openspec/config.yaml:
#   - Backend : pytest (pruebas automatizadas de FastAPI y SQLModel)
#   - Frontend: npm test + npm run lint + npm run build (React + Vite)
#

name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Backend (FastAPI + SQLModel + Python 3.12)
  # ==========================================================================
  backend:
    name: Backend - Pruebas Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: .

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar pruebas automatizadas (pytest)
        run: pytest

  # ==========================================================================
  # Frontend (React + Vite + Vitest)
  # ==========================================================================
  frontend:
    name: Frontend - Linter, Pruebas y Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Ejecutar Linter (Oxlint)
        run: npm run lint

      - name: Ejecutar pruebas unitarias (Vitest)
        run: npm test

      - name: Compilar para producción (Vite Build)
        run: npm run build
